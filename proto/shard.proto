syntax = "proto3";

// import "google/protobuf/empty.proto";

package shard;

service Shard {
    rpc getShard(ShardRequest) returns (ShardReply);
    rpc storeShard(ShardData) returns (ShardSaveReply);
}

message ShardRequest {
    string shard_id_ = 1;
    string dataset_id_ = 2;
    uint64 offset = 3;
    uint64 size = 4;
}

message ShardReply {
    bytes data = 1;
}

message ShardData {
    string dataset_id_ = 1;
    bytes data = 2;
}

message ShardSaveReply {
    bool status = 1;
    string message = 2;
}