syntax = "proto3";

// import "google/protobuf/empty.proto";

package shard;

service Shard {
    rpc getShard(ShardRequest) returns (ShardReply);
    rpc storeShard(ShardData) returns (ShardSaveReply);
    rpc listShards(ListShardsRequest) returns (ListShardsReply);
}

message ShardRequest {
    string shard_id_ = 1;
    string dataset_id_ = 2;
    uint64 offset = 3;
    uint64 size = 4;
}

message ShardReply {
    bytes data = 1;
}

message ShardData {
    string dataset_id_ = 1;
    bytes data = 2;
}

message ShardSaveReply {
    bool status = 1;
    string message = 2;
}

// Add to shard.proto

message ListShardsRequest {
    string dataset_id_ = 1;
}

message ShardInfo {
    string shard_id_ = 1;
    uint64 size_ = 2;
    bytes data_ = 3;
}

message ListShardsReply {
    repeated ShardInfo shards = 1;
}